[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "refactor-cli"
version = "0.1.0"
description = "Deterministic refactoring CLI using LibCST."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "autoimport",
  "emend",
  "libcst>=1.5.0",
  "ruff>=0.6.0",
  "pyyaml>=6.0",
  "radon>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[project.scripts]
refactor-cli = "refactor_cli:main"
refactor_cli = "refactor_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/refactor_cli"]

[tool.hatch.build.targets.wheel.force-include]
"vendor/upstream_analysis/quality_gate_report.py" = "refactor_cli/vendor/upstream_analysis/quality_gate_report.py"
"vendor/upstream_analysis/find_unused.py" = "refactor_cli/vendor/upstream_analysis/find_unused.py"
