[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "refactor-cli"
version = "0.1.0"
description = "Deterministic refactoring CLI using LibCST."
readme = "docs/refactoring_tools.md"
requires-python = ">=3.10"
dependencies = [
  "libcst>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
]

[project.scripts]
refactor-cli = "refactor_cli.refactor_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/refactor_cli"]
